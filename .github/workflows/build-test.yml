name: KADOQQ Master Build Test

on:
  push:
    branches:
      - multi-domain-build
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check site configuration
        run: |
          echo "Checking config/sites.json..."
          test -f config/sites.json
          cat config/sites.json

      - name: Check required files
        run: |
          echo "Checking required KADOQQ files..."

          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f site.webmanifest
          test -f favicon.ico

          test -d artikel
          test -d faq
          test -d panduan
          test -d tentang

          echo "All required files are present."

      - name: Run multi-domain builder
        run: |
          python scripts/build.py

      - name: Verify generated site
        run: |
          echo "Checking generated build..."

          test -d dist/in2pcfix
          test -f dist/in2pcfix/index.html
          test -f dist/in2pcfix/robots.txt
          test -f dist/in2pcfix/sitemap.xml
          test -f dist/in2pcfix/favicon.ico

          echo "Generated site structure is valid."

          echo "--- Generated robots.txt ---"
          cat dist/in2pcfix/robots.txt

          echo "--- Generated sitemap URLs ---"
          grep -o "<loc>[^<]*</loc>" dist/in2pcfix/sitemap.xml

      - name: Verify domain URLs
        run: |
          echo "Checking generated domain URLs..."

          grep -q 'https://in2pcfix.com/' dist/in2pcfix/index.html
          grep -q 'https://in2pcfix.com/sitemap.xml' dist/in2pcfix/robots.txt
          grep -q 'https://in2pcfix.com/' dist/in2pcfix/sitemap.xml

          echo "Domain URL verification successful."
      
      - name: Verify login URL
        run: |
          echo "Checking generated login URL..."

          grep -q 'https://kadoqq.wiki/' dist/in2pcfix/index.html

          echo "Login URL verification successful." 

      - name: Build test successful
        run: |
          echo "======================================"
          echo " KADOQQ MASTER BUILD TEST SUCCESSFUL "
          echo "======================================"
