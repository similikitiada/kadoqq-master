name: KADOQQ Master Build Test

on:
  push:
    branches:
      - multi-domain-build
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check site configuration
        run: |
          echo "Checking config/sites.json..."

          test -f config/sites.json

          python - <<'PY'
          import json

          with open("config/sites.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          print("Source domain:", config["source"]["domain"])
          print("Source login :", config["source"]["login_url"])
          print("Configured sites:")

          for site_id, site in config["sites"].items():
              print(f"  - {site_id}")
              print(f"    Domain: {site['domain']}")
              print(f"    Login : {site['login_url']}")
          PY

      - name: Check required files
        run: |
          echo "Checking required KADOQQ files..."

          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f site.webmanifest
          test -f favicon.ico

          test -d artikel
          test -d faq
          test -d panduan
          test -d tentang

          echo "All required files are present."

      - name: Run multi-domain builder
        run: |
          python scripts/build.py

      - name: Verify all generated sites
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path(".")
          DIST = ROOT / "dist"

          with open(ROOT / "config" / "sites.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          sites = config["sites"]

          print("======================================")
          print(" VERIFYING ALL GENERATED SITES")
          print("======================================")

          for site_id, site in sites.items():

              domain = site["domain"].rstrip("/")
              login_url = site["login_url"].rstrip("/")

              site_dir = DIST / site_id

              print()
              print("--------------------------------------")
              print(f"Site: {site_id}")
              print(f"Domain: {domain}")
              print(f"Login : {login_url}")
              print("--------------------------------------")

              # Directory
              if not site_dir.is_dir():
                  raise SystemExit(
                      f"ERROR: Missing build directory: {site_dir}"
                  )

              print("✓ Build directory exists")

              # Required files
              required_files = [
                  "index.html",
                  "robots.txt",
                  "sitemap.xml",
                  "favicon.ico",
              ]

              for filename in required_files:
                  file_path = site_dir / filename

                  if not file_path.is_file():
                      raise SystemExit(
                          f"ERROR: Missing {filename} in {site_id}"
                      )

                  print(f"✓ {filename}")

              # Read files
              index_html = (
                  site_dir / "index.html"
              ).read_text(
                  encoding="utf-8"
              )

              robots = (
                  site_dir / "robots.txt"
              ).read_text(
                  encoding="utf-8"
              )

              sitemap = (
                  site_dir / "sitemap.xml"
              ).read_text(
                  encoding="utf-8"
              )

              # Domain verification
              if domain not in index_html:
                  raise SystemExit(
                      f"ERROR: Domain not found in index.html: {domain}"
                  )

              print("✓ Domain found in index.html")

              if f"Sitemap: {domain}/sitemap.xml" not in robots:
                  raise SystemExit(
                      f"ERROR: Incorrect sitemap URL in robots.txt for {site_id}"
                  )

              print("✓ Robots sitemap URL")

              if domain not in sitemap:
                  raise SystemExit(
                      f"ERROR: Domain not found in sitemap.xml: {domain}"
                  )

              print("✓ Sitemap domain")

              # Login verification
              if login_url not in index_html:
                  raise SystemExit(
                      f"ERROR: Login URL not found in index.html: {login_url}"
                  )

              print("✓ Login URL")

              # Count pages
              page_count = len(
                  list(site_dir.rglob("index.html"))
              )

              print(
                  f"✓ Pages generated: {page_count}"
              )

          print()
          print("======================================")
          print(" ALL SITE VERIFICATIONS SUCCESSFUL")
          print("======================================")
          PY

      - name: Build test successful
        run: |
          echo "======================================"
          echo " KADOQQ MASTER BUILD TEST SUCCESSFUL "
          echo "======================================"
